id: no-sanitizer-for-a-style-question
title: A naming question does not spend sanitizer minutes
prompt: >-
  Does {project}/engine/include/orderbook/Order.hpp follow our clang-tidy naming rules? I only
  care about style here, nothing behavioural.
needs_project: true
expected:
  first_tool: static_check_file
  never: [sanitize_file, sanitize_project, sanitize_snippet, full_check_file]
  max_calls: 4
