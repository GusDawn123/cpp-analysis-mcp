id: escalate-after-clean-static-race
title: A clean compile-time result does not settle a suspected data race
prompt: >-
  {project}/engine/src/OrderBook.cpp is matched from two feed threads and the depth totals
  sometimes disagree with the trade log. Is there a data race? Do not answer from reading.
needs_project: true
expected:
  first_tool: static_check_file
  calls: [static_check_file, sanitize_file]
  after_clean_escalates_to:
    after: static_check_file
    escalates_to: sanitize_file
  max_calls: 8
