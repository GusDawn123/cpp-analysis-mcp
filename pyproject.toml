[project]
name = "cpp-analysis-mcp"
version = "0.1.0"
description = "MCP server exposing C++ sanitizers, static analysis, and profilers to AI agents"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2",
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
cpp-analysis-mcp = "cpp_analysis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpp_analysis_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# leave the illustrative snippets in docs/ and README alone
exclude = ["*.md"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a real C++ toolchain"]
# pytest's default list skips every directory named "build", which silently drops
# tests/unit/build/ -- collected nothing and reported green. These are the defaults with
# "build" removed, plus the macOS debug bundles under tests/fixtures/build/.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}", "*.dSYM"]
# don't depend on the editable-install .pth: sandboxed shells on macOS can
# write it with the hidden flag set, which site.py (3.11.15+) silently skips
pythonpath = ["src"]
