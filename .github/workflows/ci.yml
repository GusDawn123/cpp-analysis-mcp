name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feat/**"

# Supersede an in-flight run when the same ref gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs repository code (tests, fixture compiles); none of them writes
# back. Read-only token, and no credentials persisted into the checkout's git
# config for that code to find.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # v7 is the newest floating major tag setup-uv publishes; later releases
      # are exact-version tags only, so @v8/@v9 will not resolve.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      - run: make lint
      - run: make type

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      # The pytest lines make test/make integration run, spelled out because the
      # windows runner has no make; one code path for all three.
      - run: uv run pytest -m "not integration"
      # All three runners ship a C++ toolchain, so the probes have something real
      # to compile: ubuntu has clang++ and g++, macos has clang++, windows has
      # LLVM clang and Visual Studio behind it.
      - run: uv run pytest -m integration

  fixtures:
    name: fixtures (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every compiler's verdict, not just the first one to fail.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang++
            python: python3
          - os: ubuntu-24.04
            compiler: g++
            python: python3
          - os: macos-15
            compiler: clang++
            python: python3
          - os: windows-2025
            compiler: clang++
            python: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Skip uv on purpose: the script is stdlib-only and this job proves it
      # still runs bare. It SKIPs the cases its platform cannot support.
      - run: ${{ matrix.python }} scripts/fixtures.py --compiler ${{ matrix.compiler }} validate
