# Publishes the toolbox image the container engine pulls. The tag below must match
# container.IMAGE -- a unit test pins the two together.
name: publish toolbox image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # arm64 rides along for Apple-silicon Docker Desktops, which would otherwise
      # run the amd64 image under emulation
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/cpp_analysis_mcp/toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gusdawn123/cpp-analysis-toolbox:0.1
