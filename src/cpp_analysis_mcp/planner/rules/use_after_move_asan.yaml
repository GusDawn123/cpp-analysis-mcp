id: 3e7a9c1b-6d2f-4c8a-b5e9-4a1d7f3c8b2e
title: use-after-move -> verify with ASan
description: >
  bugprone-use-after-move has a low false-positive rate and its bug class is
  exactly what AddressSanitizer witnesses at runtime. Worth a build.
status: experimental
when:
  tool: clang-tidy
  rules:
    - bugprone-use-after-move
    - bugprone-dangling-handle
  min_severity: warning
  min_count: 1
then:
  run: asan
  scope: translation_unit
  action: propose
provenance:
  author: gustavo
  created: 2026-08-29
  modified: 2026-08-29
  references:
    - https://clang.llvm.org/extra/clang-tidy/checks/bugprone/use-after-move.html
